spring:
  application:
    name: claims-processing-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claims_db}
    username: ${DB_USERNAME:claims_user}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  basic-auth:
    username: ${API_USERNAME:claims-service}
    password: ${API_PASSWORD:changeme}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.globalinsure.claims: INFO
